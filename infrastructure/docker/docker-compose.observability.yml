version: '3.9'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nexusforge-prometheus
    volumes:
      - ../observability/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - nexusforge

  grafana:
    image: grafana/grafana:10.4.0
    container_name: nexusforge-grafana
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning
      - ../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: nexusforge
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/service-health.json
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - nexusforge

  loki:
    image: grafana/loki:2.9.0
    container_name: nexusforge-loki
    volumes:
      - ../observability/loki:/etc/loki
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped
    networks:
      - nexusforge

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: nexusforge-alertmanager
    volumes:
      - ../observability/alertmanager:/etc/alertmanager
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - nexusforge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  nexusforge:
    external: true
