apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: nexusforge
  labels:
    app: worker
    component: async
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        component: async
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: nexusforge-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.queue.worker"]
          envFrom:
            - configMapRef:
                name: nexusforge-config
            - secretRef:
                name: nexusforge-secrets
          env:
            - name: WORKER_CONCURRENCY
              value: "2"
            - name: WORKER_QUEUE
              value: "default,priority"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "true"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "true"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: nexusforge
  labels:
    app: worker
