apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: nexusforge
  labels:
    app: worker
    component: async
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        component: async
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: nexusforge/worker:latest
          envFrom:
            - configMapRef:
                name: nexusforge-config
            - secretRef:
                name: nexusforge-secrets
          env:
            - name: WORKER_CONCURRENCY
              value: "4"
            - name: WORKER_QUEUE
              value: "default,priority"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A app.worker inspect ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - celery -A app.worker inspect ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: nexusforge
  labels:
    app: worker
