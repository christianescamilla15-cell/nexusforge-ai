apiVersion: v1
kind: Secret
metadata:
  name: nexusforge-secrets
  namespace: nexusforge
type: Opaque
stringData:
  # IMPORTANT: Replace ALL values below before deploying.
  # Never commit real secrets to version control.
  # Use: kubectl create secret generic nexusforge-secrets --from-env-file=.env
  DB_URL: "REPLACE_WITH_REAL_DATABASE_URL"
  REDIS_URL: "REPLACE_WITH_REAL_REDIS_URL"
  GROQ_API_KEY: "REPLACE_WITH_REAL_KEY"
  ANTHROPIC_API_KEY: "REPLACE_WITH_REAL_KEY"
  JWT_SECRET: "REPLACE_WITH_RANDOM_64_CHAR_SECRET"
