apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexusforge

resources:
  - ../../base

commonLabels:
  environment: production

patches:
  # Gateway: 3 replicas, larger resources, node affinity
  - target:
      kind: Deployment
      name: gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - gateway
                  topologyKey: kubernetes.io/hostname
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: role
                      operator: In
                      values:
                        - worker

  # Worker: 3 replicas, larger resources, node affinity
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - worker
                  topologyKey: kubernetes.io/hostname

  # Frontend: 3 replicas
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3

  # HPA: production scaling
  - target:
      kind: HorizontalPodAutoscaler
      name: gateway-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  - target:
      kind: HorizontalPodAutoscaler
      name: worker-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 25

  # ConfigMap: production-specific values
  - target:
      kind: ConfigMap
      name: nexusforge-config
    patch: |
      - op: replace
        path: /data/LOG_LEVEL
        value: warn
      - op: replace
        path: /data/ENVIRONMENT
        value: production
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://app.nexusforge.io"
      - op: replace
        path: /data/RATE_LIMIT_PER_MINUTE
        value: "300"

images:
  - name: nexusforge/gateway
    newTag: stable
  - name: nexusforge/worker
    newTag: stable
  - name: nexusforge/frontend
    newTag: stable
