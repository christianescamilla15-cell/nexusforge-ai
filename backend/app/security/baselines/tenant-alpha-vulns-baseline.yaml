# Mythos calibration baseline — tenant-alpha
#
# Purpose: operational context that `mythos-scanner` consumes to:
#   1. Reduce false positives (findings in remediation → downgrade priority)
#   2. Calibrate severities by mitigation layers (WAF, Vault, etc.)
#   3. Flag quick wins (one-line fixes)
#   4. Avoid re-reporting findings already documented externally
#
# Sources:
#   - Informe Ejecutivo audit-vendor (per-app)
#   - Hallazgos_Trazabilidad_5_Apps.xlsx (eng-partner, 2026-04-13)
#   - Workshop platform-vendor ARC+BSP+Especiales 2026-04-13 (remediation confirmations)
#   - Workshop app-01 2026-04-09 (mitigations confirmed)
#
# Format contract consumed by app.security.baseline_calibration.BaselineCalibration.
# Keep this file idempotent: adding rows is safe; removing rows re-exposes findings.

version: "1.0.0"
generated: "2026-04-13"

# Mitigation layers present in the environment (reduce effective severity)
mitigations:
  waf:
    provider: "corporate-cliente"
    applies_to: ["app-03-arc", "app-01"]
    blocks_patterns: ["sqli", "xss", "geo-rusia", "geo-corea-sur", "rate-limit"]
  vault:
    provider: "hashicorp-vault"
    internal_alias: "Bolt"
    on_premise: true
    applies_to: ["app-03-arc", "app-03-bsp", "app-03-special"]
    effect: "credentials injected as runtime env vars from hashed store"
  encrypted_config:
    applies_to: ["app-01"]
    effect: "connection strings encrypted in web.config (not plaintext)"

