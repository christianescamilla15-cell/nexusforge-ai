# Tenant Alpha — showcase profile for Phase A
#
# This file is committed to the repo but contains NO real client data.
# All names are generic codenames approved per docs/integration/01_agent_mapping.md.
#
# Phase A: 5 apps representing a typical legacy nexus architecture.
# Phase B will scale the same structural pattern to 31 apps by adding entries.
#
# Batch 3 update (2026-04-10): apps now support sub_projects arrays, legacy
# DB schema injection, db_inactive_since flags, and refactor decisions.
# See docs/integration/03_future_platform_vision.md section 15 for the
# rationale behind these per-app numbers.

tenant_id: tenant-alpha
display_name: Alpha Corp
seed: 42
description: >
  Synthetic showcase tenant demonstrating NexusForge's ability to modernize
  enterprise-scale legacy systems. Five applications representing a typical
  legacy nexus architecture — one shared monolithic core (app-05) with
  four satellites, mixed single-stack and multi-sub-project apps, and a
  retirement candidate with an inactive database. Mirrors real-world
  structural patterns without referencing any specific client or industry.

# ─── Compliance profile (Batch 3, deliverable D) ──────────────────────────
# Tenant-wide regulatory and deadline metadata. Consumed by the synth
# generator, the /api/refactor/showcase/<id>/compliance endpoint and the
# frontend TenantShowcase countdown card. All certifications, frameworks
# and dates below are generic industry standards — no real client data.
compliance:
  hard_deadline: "2026-09-30"
  audit_cadence: Monthly steering committee, day 14 of each month
  narrative: >
    Publicly-traded enterprise with a 4.5-month modernization window from
    the start of execution to the hard production-readiness deadline.
    Three certifications in scope: a financial-controls framework, a
    security operations attestation and a data-privacy regulation. Each
    tracks against the same hard deadline to unify steering reporting.
  certifications:
    - name: SOX Section 404
      framework: Sarbanes-Oxley Act / PCAOB AS 2201
      due_date: "2026-09-30"
      status: in_progress
      owner: cfo-office
      description: >
        Internal controls over financial reporting. Revenue-accounting
        systems are in scope because they feed the general ledger.
    - name: SOC 2 Type II
      framework: AICPA Trust Services Criteria
      due_date: "2026-09-30"
      status: in_progress
      owner: ciso
      description: >
        Operational controls attestation covering security, availability
        and confidentiality. 12-month audit window ends at the hard
        deadline. Failure risks customer-contract renewals.
    - name: Data Privacy Regulation
      framework: Generic GDPR-style data protection
      due_date: "2026-09-30"
      status: at_risk
      owner: dpo
      description: >
        Personal data exposure during a prior incident triggered a
        regulator review. Encryption at rest, access logs and retention
        policies must be certified before the hard deadline.
  phases:
    - name: Discovery
      start_date: "2026-04-01"
      end_date: "2026-04-30"
      milestones:
        - Code access granted for all apps in scope
        - Architecture sign-off with steering committee
        - Per-app refactor decisions locked in
    - name: Execution
      start_date: "2026-05-01"
      end_date: "2026-06-30"
      milestones:
        - Credentials centralization complete across all apps
        - SQL injection fixes landed in production for apps 01, 02, 04
        - Anti-corruption layer designed for legacy databases
    - name: Testing and UAT
      start_date: "2026-07-01"
      end_date: "2026-08-31"
      milestones:
        - Automated test coverage >= 70% on critical paths
        - Security scan clean-up (0 BLOCKER / 0 CRITICAL remaining)
        - Compliance pre-audit walkthrough complete
    - name: Production cutover and compliance sign-off
      start_date: "2026-09-01"
      end_date: "2026-09-30"
      milestones:
        - Production cutover for all apps on schedule
        - SOX + SOC 2 + privacy certifications signed off
        - Post-launch monitoring and incident runbooks in place

# ─── Commercial risk profile (Batch 3 follow-up) ──────────────────────────
# Vendor concentration, contract coverage gaps and penalty exposure. All
# vendor names are generic codenames; dollar amounts are round numbers
# reflecting the structural profile of a typical enterprise modernization
# program at this scale. Consumed by the /api/refactor/showcase/{id}/commercial-risk
# endpoint and eventually by the strangler planner for phase ordering.
commercial_risk:
  contract_gap_pct: 40.0
  total_exposure_usd: 18500000
  narrative: >
    The tenant runs on a legacy platform operated by a single external
    vendor that derives the majority of its revenue from this account.
    Roughly 40% of current billings are executed without a written
    contract, creating commercial exposure independent of technical
    debt. Worst-case penalty caps sum to ~$18.5M USD across
    reputational, privacy and data-integrity scenarios.
  vendors:
    - name: legacy-platform-vendor
      category: legacy-platform
      revenue_share_pct: 60.0
      spend_2y_usd: 8600000
      contract_coverage_pct: 60.0
      lock_in_level: high
      notes: >
        Operates and maintains the legacy core plus ~15 satellite apps.
        60% of vendor's total revenue comes from this tenant. Historical
        other customers have churned, limiting the vendor's ability to
        invest in modernization.
    - name: cloud-hyperscaler
      category: cloud
      revenue_share_pct: 0.1
      spend_2y_usd: 2400000
      contract_coverage_pct: 100.0
      lock_in_level: medium
      notes: Hosts ~90% of non-mainframe workloads under a standard enterprise agreement.
    - name: consulting-partner
      category: consulting
      revenue_share_pct: 5.0
      spend_2y_usd: 1200000
      contract_coverage_pct: 100.0
      lock_in_level: low
      notes: Short-term engagements for discovery, assessment and program management.
  penalty_exposure:
    - category: reputational
      cap_usd: 13000000
      driver: Public-market exposure from a major security or data incident during the modernization window.
    - category: privacy
      cap_usd: 5000000
      driver: Regulatory fines under generic data-protection frameworks if PII exposure persists past the hard deadline.
    - category: integrity
      cap_usd: 500000
      driver: Annualized loss from data-integrity issues in the reconciliation pipeline.

# ─── Governance profile (Batch 3 follow-up) ───────────────────────────────
# Organizational structure of the modernization program: steering
# committee cadence, delivery teams, code access gate, and the state of
# the post-launch tech lead slot. All names are generic role labels.
governance:
  narrative: >
    Two delivery teams run in parallel under a single program manager
    hired specifically to coordinate them. The legacy-platform vendor
    controls write access to the target repositories via an
    intermediate reviewer, which is a known delivery bottleneck but
    not a security control. A post-launch tech lead role is being
    recruited to own knowledge transfer from the modernization teams.
  raci_summary: >
    Responsible: delivery teams. Accountable: program manager.
    Consulted: architecture steering + compliance. Informed: CEO +
    CFO + CISO.
  steering:
    cadence: Monthly, day 14 of each month
    owner_role: program-manager
    first_formal_review: "2026-04-15"
    attendees:
      - program-manager
      - architecture-lead
      - compliance-lead
      - ciso
      - cfo-delegate
      - legacy-vendor-liaison
  teams:
    - name: team-primary
      role: primary-delivery
      app_scope: [app-01, app-02, app-03, app-04, app-05]
      headcount: 4
      status: active
    - name: team-secondary
      role: parallel-delivery
      app_scope: []  # owns apps outside this tenant's scope
      headcount: 5
      status: active
    - name: team-core
      role: external-vendor
      app_scope: []  # owns the legacy core workstream
      headcount: 8
      status: active
  code_access:
    model: intermediate-reviewer
    owner_role: legacy-vendor-reviewer
    bottleneck: true
    notes: >
      All code changes are routed through an intermediate reviewer
      owned by the legacy-platform vendor before they reach the
      target branches. This is a delivery bottleneck (not a security
      control) and must be modeled when estimating throughput.
  tech_lead:
    status: recruiting
    scope: >
      Post-launch ownership of the refactored apps, knowledge
      transfer from external delivery teams, and incident response
      runbooks for production cutover.
    target_start_date: "2026-06-01"

apps:
  # ─── app-01: Transaction Reconciliation Service ──────────────────────
  # Single-project C# ASP.NET / .NET Framework 4.6.1 app with a legacy
  # SQL Server / MySQL backend. The classic "mature but neglected" case:
  # workable code, terrible database integrity (0 FK), stored procedures
  # unchanged since 2012.
  - codename: app-01
    label: Transaction Reconciliation Service
    loc_target: 65000
    primary_language: csharp
    modules: 12
    inject_legacy_db_schema: true
    # Batch 3 follow-up: real enterprise apps at this scale consistently
    # have 1-2 god methods with cyclomatic complexity >= 150. Inject one
    # so the refactor engine's god-class detector (CC > 20) trips on
    # realistic numbers during showcase runs.
    inject_god_method_cc: 150
    databases:
      - engine: mysql
        tables: 51
        pii_columns: 8
    vulnerabilities:
      sql_injection: 600
      hardcoded_creds: 12
      weak_crypto: 4
      pii_leak: 30
      suppressed_exceptions: 85
      missing_fk: 51
    decision:
      action: refactor
      phase: Q3
      rationale: >
        Mature app with well-understood domain and the highest documentation
        coverage in the portfolio. Refactor rather than replace. Priority
        focus: credentials centralization, FK restoration, stored procedure
        modernization, cyclomatic complexity reduction.
      validation_checklist:
        - All hardcoded credentials migrated to secrets manager
        - Foreign keys restored on all 51 tables with data clean-up
        - Stored procedures 67→20 via consolidation
        - Index optimization complete (slow queries 27→10)
        - Test coverage 0%→70% on critical paths

  # ─── app-02: Batch Sales Management ──────────────────────────────────
  # Lowest-risk app in the portfolio — well-documented, fewer findings,
  # lowest BLOCKER density. Also first to finish in the phase plan.
  - codename: app-02
    label: Batch Sales Management
    loc_target: 40000
    primary_language: csharp
    modules: 10
    # Gap I (2026-04-12): corpus R8 (Comercial) reveals 4 sub-domains
    # under this app: audit/revision, TDIs, pólizas, consumo de datos.
    # Modeled as sub_projects so the refactor engine can scope findings
    # per sub-domain instead of treating the whole app as one block.
    sub_projects:
      - name: audit-revision
        language: csharp
        loc_share: 0.30
        vuln_share: 0.25
        modules: 3
      - name: tdi-reporting
        language: csharp
        loc_share: 0.25
        vuln_share: 0.25
        modules: 3
      - name: polizas
        language: csharp
        loc_share: 0.25
        vuln_share: 0.30
        modules: 2
      - name: data-consumption
        language: csharp
        loc_share: 0.20
        vuln_share: 0.20
        modules: 2
    databases:
      - engine: sqlserver
        tables: 60
        pii_columns: 12
    vulnerabilities:
      sql_injection: 450
      hardcoded_creds: 10
      weak_crypto: 5
      pii_leak: 25
      suppressed_exceptions: 70
      missing_fk: 55
    decision:
      action: refactor
      phase: Q3
      rationale: >
        Mid-complexity app with good documentation. Backend refactor plus
        frontend XSS sanitization. Low BLOCKER density means the team can
        start here to build momentum before tackling the harder cases.
      validation_checklist:
        - XSS sanitization via DOMPurify-equivalent
        - Legal data endpoint authorization restored
        - Cyclomatic complexity reduced from 45→<15
        - Secrets centralization complete

  # ─── app-03: Automated Refund Processing ─────────────────────────────
  # Multi-stack refund automation with an INACTIVE database (0% transactions
  # for ~2.5 years). Candidate for decommission but requires dual validation
  # (technical + business) before retirement. Now modelled as 3 sub-projects
  # because real-world RPA apps always bundle: RPA robot + REST backend +
  # thin operator UI.
  - codename: app-03
    label: Automated Refund Processing
    loc_target: 80000
    primary_language: python
    has_rpa: true
    db_inactive_since: "2023-03-15"
    sub_projects:
      - name: rpa-robot
        language: python
        loc_share: 0.35
        vuln_share: 0.4
        modules: 8
        has_rpa: true
      - name: rest-backend
        language: python
        loc_share: 0.4
        vuln_share: 0.5
        modules: 7
      - name: operator-ui
        language: typescript
        loc_share: 0.20
        vuln_share: 0.05
        modules: 5
      # Gap B (2026-04-12): Reembolsos Especiales is a SEPARATE flow from
      # the automated refund processing above. Pattern: "modern UI over
      # legacy" (Python+Flask+React OVER praxis-ecosystem Core Cobol).
      # Zenobio (developer) confirmed Python, NOT .NET as PM stated.
      - name: reembolsos-especiales
        language: python
        loc_share: 0.05
        vuln_share: 0.05
        modules: 3
    databases:
      - engine: sqlite
        tables: 15
        pii_columns: 4
      - engine: db2
        tables: 30
        pii_columns: 10
    vulnerabilities:
      sql_injection: 200
      hardcoded_creds: 8
      weak_crypto: 2
      command_injection: 3
      pii_leak: 18
      suppressed_exceptions: 45
      missing_fk: 25
    decision:
      action: tbd
      phase: IMMEDIATE
      rationale: >
        Database has been inactive for ~2.5 years (zero transactional volume
        since 2023-03-15). Vendor recommends retirement. Team requires dual
        validation before decommission: (1) confirm exploits are not
        actually reachable through the operator UI, (2) confirm no business
        process still depends on the engine. Default to refactor if either
        validation fails.
      validation_checklist:
        - Business ownership confirmation (is this system truly orphaned?)
        - Attack-surface validation (are reported CVEs actually exploitable?)
        - Downstream consumer audit (any scheduled job still hits the DB?)
        - Data archival plan signed off by compliance
      blockers:
        - Legacy vendor has veto rights on decommission decisions
        - Business owner contact is ambiguous (no clear RACI)

  # ─── app-04: Document Batch Ingestion ────────────────────────────────
  # NOT yet analyzed by the vendor assessment. Discovery phase required
  # before any refactoring plan can be written. Kept as a placeholder
  # single-project with modest vulnerability budget so the pipeline still
  # finds something during the discovery run.
  - codename: app-04
    label: Document Batch Ingestion
    loc_target: 30000
    primary_language: csharp
    additional_languages: [vbnet]
    modules: 9
    databases:
      - engine: sqlserver
        tables: 40
        pii_columns: 6
    vulnerabilities:
      sql_injection: 400
      hardcoded_creds: 9
      weak_crypto: 6
      pii_leak: 22
      suppressed_exceptions: 60
      missing_fk: 35
    decision:
      action: tbd
      phase: TBD
      rationale: >
        Not analyzed by the vendor Report Out. No Kardex report, no code
        findings summary, no cyclomatic complexity data. A discovery
        workshop is required to establish a baseline before the refactor
        plan can be written.
      validation_checklist:
        - Schedule discovery workshop with SMEs
        - Run full vulnerability scan (parity with other apps)
        - Confirm external integration sandbox availability
        - Produce a phase-assignment proposal
      blockers:
        - External integration has no known test/sandbox environment
        - SMEs for the legacy document pipeline are scattered across teams

  # ─── app-05: Commission Engine (the shared legacy nexus) ─────────────
  # The hardest case in the portfolio: on-premise, multi-language, multi-DB,
  # and shares core data classes with modules owned by other teams. Modelled
  # as 4 sub-projects representing the 4 runtime languages. Mainframe COBOL
  # component is WRAP-ONLY — never rewrite.
  - codename: app-05
    label: Commission Engine
    loc_target: 161000
    primary_language: csharp
    has_cobol_layer: true
    is_shared_nexus: true
    sub_projects:
      - name: cobol-core
        language: cobol
        loc_share: 0.25
        vuln_share: 0.2
        modules: 4
      - name: java-analytics
        language: java
        loc_share: 0.3
        vuln_share: 0.35
        modules: 10
      - name: csharp-orchestrator
        language: csharp
        loc_share: 0.3
        vuln_share: 0.35
        modules: 12
      - name: typescript-admin-ui
        language: typescript
        loc_share: 0.15
        vuln_share: 0.1
        modules: 6
    databases:
      - engine: sqlserver
        tables: 80
        pii_columns: 15
      - engine: db2
        tables: 50
        pii_columns: 8
      - engine: mysql
        tables: 30
        pii_columns: 6
      - engine: oracle
        tables: 40
        pii_columns: 10
    vulnerabilities:
      sql_injection: 1350
      hardcoded_creds: 25
      weak_crypto: 10
      command_injection: 1
      pii_leak: 55
      suppressed_exceptions: 180
      missing_fk: 120
    decision:
      action: refactor
      phase: Phase-2
      rationale: >
        Nexus app — shared core data classes with modules outside the
        current tenant scope (cross-team coupling). Full refactor is
        multi-phase: extract outer API, lift shared models, introduce
        anti-corruption layer on the database, untangle the shared
        libraries, and WRAP the mainframe COBOL component behind a REST
        adapter. Never rewrite the COBOL core.
      validation_checklist:
        - Cross-team coupling dependencies mapped
        - Anti-corruption layer designed for legacy DB
        - COBOL wrapper API contract approved
        - Shared-library migration path agreed with consumer teams
      blockers:
        - Shared core classes require sign-off from at least 2 external teams
        - Mainframe infrastructure is on a vendor-managed platform

# ─── Discovery-sourced profiles (Gaps D, J, K, P-005 — 2026-04-12) ───────
#
# These fields come from the corpus analysis pipeline (90 hallazgos across
# 31 transcribed discovery meetings). They capture infrastructure, program,
# and dependency realities that the Softtek Report Out did NOT evaluate
# (which focused on code/vulnerabilities, not operations/governance).

orchestration_model: "none"  # H-111: no Control-M, no Airflow. Humans + notifications.

infrastructure_risk:
  orchestrator: "none"
  blueprint_exists: false           # H-112: lost ~2015 when platform-vendor switched to services model
  server_model: "IBM Power 9000"    # H-113: single server, Dev/QA/Prod on same instances
  server_count: 1
  environments_on_same_server: true
  redundancy_type: "none"
  capacity_planning_freq: "annual"

modernization_program:
  name: "dynamics"
  total_apps: 350
  migrated_apps: 200
  strategies:
    - retire
    - refactor
    - replatform
    - rehost
  activities_per_app: 170           # Atlas framework
  tier_classification:
    tier0: "5 min downtime max"
    tier1: "4 hour downtime max"
    tier2: "24 hour downtime max"
  scope_apps_status:
    app-01: "not-started"
    app-02: "completed"
    app-03: "completed"
    app-04: "completed"
    app-05: "not-started"

third_party_deps:
  - name: "valdemar-rpa"
    role: "rpa-operator"
    documented: false
    risk_level: "high"
    apps_affected:
      - app-05
  - name: "multiplica-dev"
    role: "dev-contractor"
    documented: false
    risk_level: "medium"
    apps_affected:
      - app-01
  - name: "doble-v"
    role: "rpa-operator"
    documented: false
    risk_level: "high"
    apps_affected:
      - app-05

# ─── Phase B scaffolding — non-scope apps (discovery-pending stubs) ───────
#
# The 5 apps above are the full modernization scope with corrected Report Out
# numbers. The remaining 26 apps below make the tenant footprint reach the
# 31-app enterprise total documented in integration/03_future_platform_vision.md
# §15. Each stub emits a single ``DISCOVERY_PENDING.md`` file — NO code trees,
# NO vulnerabilities, NO databases. The refactor engine treats them as
# "scope requires discovery" during ingestion so they count toward the
# footprint without polluting the finding totals from the 5 scope apps.
#
# Categories (informational only — consumers can filter by them):
#   - satellite         : peripheral app around the shared core
#   - shared-library    : internal library used by multiple apps
#   - archival          : read-only historical data access
#   - utility           : small operational tool
#   - integration       : ETL/messaging/API glue
#
# When one of these apps enters scope in a future phase, MOVE the entry
# from this section to the ``apps:`` section above with a full recipe and
# then DELETE it from here. The stub will disappear from the tenant tree
# on the next generator run.
non_scope_apps:
  - codename: app-06
    label: Customer Portal Facade
    category: satellite
    notes: Lightweight public-facing portal that proxies app-01 transactions. Ownership unclear.
  - codename: app-07
    label: Partner Integration Gateway
    category: integration
    notes: B2B EDI gateway. Runbook exists but no code ownership claimed.
  - codename: app-08
    label: Finance Reporting Pack
    category: archival
    notes: Read-only monthly close reports. Scheduled to retire after SOX remediation.
  - codename: app-09
    label: Internal Admin Console
    category: utility
    notes: Ops tool used by ~3 engineers for manual data fixes.
  - codename: app-10
    label: Document Archive Service
    category: archival
    notes: Large binary blob store. In scope only if legal holds are triggered.
  - codename: app-11
    label: Audit Log Aggregator
    category: shared-library
    notes: Consumed by apps 01, 02 and 05. Contract is stable but has no owner.
  - codename: app-12
    label: Notifications Dispatcher
    category: integration
    notes: Email/SMS fan-out used by the Commission Engine (app-05) and partner gateway.
  - codename: app-13
    label: Batch Export Tool
    category: utility
    notes: Nightly CSV exports to the data lake. Slated for decommission.
  - codename: app-14
    label: Legacy Customer Lookup
    category: archival
    notes: Pre-2018 customer records, read-only.
  - codename: app-15
    label: Vendor Invoice Importer
    category: integration
    notes: Pulls vendor invoices via SFTP. Under 5K LOC but completely undocumented.
  - codename: app-16
    label: Shared Authentication Service
    category: shared-library
    notes: Internal SSO. Already identified as a high-coupling risk.
  - codename: app-17
    label: Configuration Cache
    category: shared-library
    notes: Consumed by apps 01-05 at startup. Dependency on the COBOL core.
  - codename: app-18
    label: Rate Card Editor
    category: satellite
    notes: Low-volume editorial tool for finance analysts.
  - codename: app-19
    label: Reconciliation Replay Harness
    category: utility
    notes: Dev-only replay tool. May overlap with app-01 during refactor.
  - codename: app-20
    label: Historical Commissions Viewer
    category: archival
    notes: Frozen snapshot of pre-migration commission data.
  - codename: app-21
    label: Legacy SSO Bridge
    category: integration
    notes: Temporary bridge between the new IdP and pre-2020 apps.
  - codename: app-22
    label: Daily Backfill Worker
    category: utility
    notes: Idle most of the day. Only runs during outages.
  - codename: app-23
    label: Customer Onboarding Form
    category: satellite
    notes: Intake form that feeds app-02. Low traffic but external-facing.
  - codename: app-24
    label: Shared Data Dictionary (Catálogos)
    category: shared-library
    notes: >
      Gap E (2026-04-12): centralized schema catalog consumed by apps 01,
      02, and 05. Corpus R16 (Catálogos session) confirms this is a
      cross-cutting master data dependency — changes to the catalog
      schema affect all 3 consumers. Should be promoted to a full
      recipe if it enters scope.
  - codename: app-25
    label: Compliance Export Job
    category: archival
    notes: Monthly regulator export. Hard-coded file paths.
  - codename: app-26
    label: Integration Test Runner
    category: utility
    notes: Internal tool used by QA. No external consumers.
  - codename: app-27
    label: Legacy Employee Directory
    category: archival
    notes: Deprecated but still consulted during audits.
  - codename: app-28
    label: Partner Webhook Receiver
    category: integration
    notes: Accepts async callbacks from partner gateway (app-07).
  - codename: app-29
    label: Monitoring Dashboard Shim
    category: utility
    notes: Thin wrapper over Prometheus metrics. Low code volume.
  - codename: app-30
    label: Data Quality Sampler
    category: utility
    notes: Produces quality-of-data snapshots for the commission engine.
  - codename: app-31
    label: Shared Cron Library
    category: shared-library
    notes: Tiny utility library used for scheduled jobs. Widely imported.
