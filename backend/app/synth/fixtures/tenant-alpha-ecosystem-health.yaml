# Tenant-alpha ecosystem health metrics — baseline dataset (P-021)
#
# Purpose: quantitative baseline that NexusForge consumes to:
#   1. Make Report Out simulator produce numbers consistent with a real
#      ecosystem of this scale (not generic placeholders).
#   2. Calibrate strangler_planner priority: apps with higher critical
#      density + higher risk exposure get earlier phases.
#   3. Validate NexusForge internal tests against a realistic baseline
#      (behavior should match these shape/scale numbers).
#
# Sources (all from eng-partner canonical deliverables 2026-04-13):
#   - Report Out audit-vendor (168 pages)
#   - SonarQube CSV dumps (platform-vendor core COBOL)
#   - Hallazgos_Trazabilidad_5_Apps.xlsx (praxis-ecosystem sheet)
#   - Panorama_Completo_5_Aplicativos.xlsx (Resumen Ejecutivo sheet)
#
# All names are generic codenames per docs/integration/01_agent_mapping.md.
# This file is committed to the repo; it contains NO real client data.

