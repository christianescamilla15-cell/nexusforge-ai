  - pattern: "credentials-in-config"
    prevalence: "8/12"
    note: "Majority of ecosystem has credentials in web.config or env vars (app-01 is the exception: encrypted)."
  - pattern: "zero-automated-tests"
    prevalence: "12/12"
    note: "100% of ecosystem without automated tests. Manual validation only."
  - pattern: "no-ci-cd"
    prevalence: "11/12"
    note: "Deploy is manual in all but one app."
  - pattern: "sql-concatenation-sqli-risk"
    count: 3_000
    note: "Injection potential systemic across ecosystem."
  - pattern: "tables-without-fk"
    prevalence_pct: 97.0
    note: "No referential integrity at DB layer — integrity checks rest in application code."

# ── Strangler prioritization hints ─────────────────────────────────────
# Consumed by strangler_planner when this baseline is loaded alongside
# a DiscoveryIndex. Higher priority_score = earlier phase.
priority_hints:
