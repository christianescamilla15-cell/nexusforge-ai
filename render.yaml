services:
  - type: web
    name: nexusforge-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: nexusforge-db
          property: connectionURI
      - key: REDIS_URL
        sync: false  # Set manually: Upstash Redis URL (free tier)
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://frontend-silk-three-66.vercel.app,https://nexusforge.vercel.app"

databases:
  - name: nexusforge-db
    plan: free
    databaseName: nexusforge
    postgresMajorVersion: "16"
