services:
  - type: web
    name: nexusforge-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: nexusforge-db
          property: connectionURI
      - key: REDIS_URL
        sync: false  # Set manually: Upstash Redis URL (free tier)
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
      # H-5 (2026-04-25): explicit allowlist of *current* frontend
      # origins. Removed `frontend-silk-three-66.vercel.app` — that
      # alias was a stale Vercel preview that anyone could redeploy
      # over (Vercel preview hijack class). Canonical frontend is
      # nexusforge-two.vercel.app per CLAUDE.md; the unsuffixed
      # `nexusforge.vercel.app` is kept as a possible alias target.
      # Add NEW origins here only after verifying ownership in Vercel.
      - key: ALLOWED_ORIGINS
        value: "https://nexusforge-two.vercel.app,https://nexusforge.vercel.app"

databases:
  - name: nexusforge-db
    plan: free
    databaseName: nexusforge
    postgresMajorVersion: "16"
