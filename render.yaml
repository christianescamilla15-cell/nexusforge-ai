services:
  - type: web
    name: nexusforge-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: nexusforge-db
          property: connectionURI
      - key: REDIS_URL
        sync: false  # Set manually: Upstash Redis URL (free tier)
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # H-2 Phase 1+2+3 (2026-04-27): dedicated secrets per surface.
      # Each is OPTIONAL — when unset, falls back to deriving from
      # JWT_SECRET (back-compat, current behavior). Set them
      # individually to enable per-surface rotation.
      - key: JWT_SIGNING_SECRET   # JWT HS256 signing — rotate without bricking Fernet
        sync: false
      - key: MYTHOS_HMAC_SECRET   # /api/mythos/* X-Mythos-Key derivation
        sync: false
      - key: FERNET_KEY           # primary Fernet for nf_api_keys (44-char canonical)
        sync: false
      - key: FERNET_KEYS_OLD      # rotation-overlap secondary keys (comma-separated)
        sync: false
      # H-2 Phase 3: feature flag for the short-access + refresh
      # token model. Default OFF (issue 8h JWTs). Flip to "true"
      # after the frontend learns to call /auth/refresh.
      - key: ENABLE_REFRESH_TOKENS
        value: "false"
      - key: VOYAGE_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
      # H-5 (2026-04-25): explicit allowlist of *current* frontend
      # origins. Removed `frontend-silk-three-66.vercel.app` — that
      # alias was a stale Vercel preview that anyone could redeploy
      # over (Vercel preview hijack class).
      #
      # 2026-04-30 update: corrected the canonical frontend URL.
      # Pre-this-date docs claimed `nexusforge-two.vercel.app` was
      # canonical, but the project actually deployed and used by
      # users (Google OAuth allowlisted to it) is
      # `07-nexusforge-ai.vercel.app`. The previous Vercel project
      # (`nexusforge`, owns `nexusforge-two.vercel.app`) is an orphan
      # awaiting cleanup. Both origins kept here so neither breaks
      # while the orphan project is being deprecated.
      # Add NEW origins here only after verifying ownership in Vercel.
      #
      # NOTE: this blueprint default is only used on FIRST deploy.
      # Runtime overrides via the Render env-vars dashboard take
      # precedence. As of 2026-04-30 this var is NOT set on Render,
      # so the backend falls back to wildcard CORS (allow_origins=["*"]
      # with allow_credentials=False — see backend/app/main.py:203).
      # Set ALLOWED_ORIGINS via the Render dashboard if you want to
      # lock CORS down to specific origins.
      - key: ALLOWED_ORIGINS
        value: "https://07-nexusforge-ai.vercel.app,https://nexusforge-two.vercel.app"

databases:
  - name: nexusforge-db
    plan: free
    databaseName: nexusforge
    postgresMajorVersion: "16"
